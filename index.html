<!DOCTYPE html> <!-- Document type declaration -->
<html lang="en"> <!-- Root element with language attribute -->
<head> <!-- Metadata container -->
  <meta charset="UTF-8"> <!-- Character encoding attribute -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Responsive viewport attributes -->
  <title>Next Chapter - The Controlled Build</title> <!-- Document title element -->
  <link rel="stylesheet" href="css/styles.css"> <!-- External stylesheet link -->
</head> <!-- Metadata container closing tag -->
<body> <!-- Visible content container -->
  <main class="main-content"> <!-- Semantic main element -->
    <section id="hero-section" class="hero-section"> <!-- Semantic hero section -->
      <h1 class="hero-headline">Celerbrating Jackson Our Buddy</h1> <!-- Primary heading element -->
      <img class="hero-photo" src="assets/jacksonHero.jpeg" alt="Jackson Hero Pic"> <!-- Image element with attributes -->
                                               
      <h5 class="hero-text">We love you brother and I miss going hiking with you up on the mountain.</h5> <!-- First level-five heading element -->
      <h5 class="hero-text">I know in doggy heaven you are playing a lot of freezbee and cashing ticks.</h5> <!-- Second level-five heading element -->
      <h5 class="hero-text">Jackson you will always be in our hearts and we think about you everyday.</h5> <!-- Third level-five heading element -->
    </section> <!-- Hero section closing tag -->
    <section id="photo-gallery" class="photo-gallery"> <!-- Semantic gallery section -->
      <h2 class="gallery-heading">Photo Gallery</h2> <!-- Secondary heading element -->
      <div class="gallery-grid"> <!-- Gallery container element -->
        <img class="gallery-photo" src="assets/jackson.jpeg" alt="Jackson Pic 1"> <!-- First image attribute -->
        <img class="gallery-photo" src="assets/jackson2.jpeg" alt="Jackson Pic 2"> 
        <img class="gallery-photo" src="assets/jackson3.jpeg" alt="Jackson Pic 3"> 
        <img class="gallery-photo" src="assets/jackson4.jpeg" alt="Jackson Pic 4"> 
        <img class="gallery-photo" src="assets/jackson5.jpeg" alt="Jackson Pic 5"> 
        <img class="gallery-photo" src="assets/jackson6.jpeg" alt="Jackson Pic 6"> 
        <img class="gallery-photo" src="assets/jackson7.jpeg" alt="Jackson Pic 7"> 
        <img class="gallery-photo" src="assets/jackson8.jpeg" alt="Jackson Pic 8"> 
        <img class="gallery-photo" src="assets/jackson9.jpeg" alt="Jackson Pic 9"> 
        <img class="gallery-photo" src="assets/jackson10.jpeg" alt="Jackson Pic 10"> 
        <img class="gallery-photo" src="assets/jackson11.jpeg" alt="Jackson 11 11"> 
        <img class="gallery-photo" src="assets/jackson12.jpeg" alt="Jackson Pic 12"> 
        <img class="gallery-photo" src="assets/jackson13.jpeg" alt="Jackson Pic 13"> 
        <img class="gallery-photo" src="assets/jackson14.jpeg" alt="Jackson Pic 14"> 
      </div> <!-- Gallery container closing tag -->
      <div class="gallery-pair"> <!-- Centered two-image group -->
        <img class="gallery-photo" src="assets/aNewDay.jpg" alt="A New Day">
        <img class="gallery-photo" src="assets/United.jpg" alt="United">
      </div> <!-- Centered two-image group closing tag -->
    </section> <!-- Gallery section closing tag -->
    <section id="video-gallery" class="video-gallery"> <!-- Semantic video section -->
      <h2 class="video-heading">Videos</h2> 
      <div class="video-placeholders"> <!-- Flip card container -->
        <button class="flip-card" type="button" aria-pressed="false">
          <span class="flip-card-inner">
            <span class="flip-card-face flip-card-front">New Day Pic</span>
            <span class="flip-card-face flip-card-back">
              <img src="assets/A New Day.jpg" alt="New Day Image">
            </span>
          </span>
        </button>
        <button class="flip-card" type="button" aria-pressed="false">
          <span class="flip-card-inner">
            <span class="flip-card-face flip-card-front">Jackson Video 2</span>
            <span class="flip-card-face flip-card-back">
              <img src="assets/United.jpg" alt="United Image">
            </span>
          </span>
        </button>
      </div> <!-- Flip card container closing tag -->
    </section> <!-- Video section closing tag -->
  </main> <!-- Main element closing tag -->
  <script src="js/main.js"></script> <!-- External script element -->
</body> <!-- Visible content closing tag -->
</html> <!-- Root element closing tag -->
